<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Enter your delivery details and place your ShopEasy order.">
  <title>Checkout | ShopEasy</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="site-header"><div class="header-inner">
    <a class="brand" href="index.html" aria-label="ShopEasy home"><span class="brand-mark">S</span>ShopEasy</a>
    <nav class="main-nav" aria-label="Main navigation"><a id="home-link" href="index.html">Home</a><a id="products-link" href="products.html">Products</a><a id="login-link" href="login.html">Login</a><a id="cart-link" class="cart-nav-link" href="cart.html">Cart <span id="cart-count" class="cart-count">0</span></a></nav>
  </div></header>

  <main class="section-wrap page-main checkout-page">
    <div class="page-title-row"><div><p class="eyebrow eyebrow-dark">Almost yours</p><h1>Checkout</h1></div><a class="text-link" href="cart.html">Back to cart</a></div>
    <div class="checkout-layout">
      <form id="checkout-form" class="form-panel checkout-form">
        <h2>Delivery details</h2>
        <div class="form-grid">
          <div class="field-group field-wide"><label for="full-name">Full Name</label><input id="full-name" name="fullName" type="text" autocomplete="name" required></div>
          <div class="field-group"><label for="checkout-email">Email</label><input id="checkout-email" name="email" type="email" autocomplete="email" required></div>
          <div class="field-group"><label for="phone">Phone Number</label><input id="phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel" maxlength="10" placeholder="10-digit number" required></div>
          <div class="field-group field-wide"><label for="address">Address</label><textarea id="address" name="address" rows="3" autocomplete="street-address" required></textarea></div>
          <div class="field-group"><label for="city">City</label><input id="city" name="city" type="text" autocomplete="address-level2" required></div>
          <div class="field-group"><label for="state">State</label><input id="state" name="state" type="text" autocomplete="address-level1" required></div>
          <div class="field-group"><label for="pin-code">PIN Code</label><input id="pin-code" name="pinCode" type="text" inputmode="numeric" autocomplete="postal-code" maxlength="6" placeholder="6-digit PIN" required></div>
          <div class="field-group"><label for="payment-method">Payment Method</label><select id="payment-method" name="paymentMethod" required><option value="">Choose a payment method</option><option value="Cash on Delivery">Cash on Delivery</option><option value="Credit/Debit Card">Credit/Debit Card</option><option value="UPI">UPI</option></select></div>
        </div>
        <p id="checkout-message" class="form-message" role="status" aria-live="polite"></p>
        <button id="place-order-btn" class="button button-dark button-full" type="submit">Place Order</button>
      </form>
      <aside class="order-summary checkout-summary"><h2>Order total</h2><p class="summary-caption">Delivery is on us.</p><div class="summary-row summary-total"><span>Total</span><span id="checkout-total">₹0</span></div><a class="back-to-cart" href="cart.html">Review cart</a></aside>
    </div>
    <section id="order-success" class="order-success" role="status" aria-live="polite" hidden><span class="success-mark" aria-hidden="true">&#10003;</span><div><h2>Order placed successfully!</h2><p>Your order ID is <strong id="order-id"></strong>.</p><a class="text-link" href="products.html">Continue shopping <span aria-hidden="true">&#8594;</span></a></div></section>
  </main>

  <footer id="site-footer" class="site-footer"><div class="section-wrap footer-inner"><a class="brand brand-footer" href="index.html"><span class="brand-mark">S</span>ShopEasy</a><p>Thoughtful picks for everyday life.</p><p class="copyright">&copy; 2026 ShopEasy</p></div></footer>
</body>
</html>
