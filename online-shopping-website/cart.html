<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Review your ShopEasy shopping cart.">
  <title>Your Cart | ShopEasy</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="site-header"><div class="header-inner">
    <a class="brand" href="index.html" aria-label="ShopEasy home"><span class="brand-mark">S</span>ShopEasy</a>
    <nav class="main-nav" aria-label="Main navigation"><a id="home-link" href="index.html">Home</a><a id="products-link" href="products.html">Products</a><a id="login-link" href="login.html">Login</a><a id="cart-link" class="cart-nav-link active" href="cart.html" aria-current="page">Cart <span id="cart-count" class="cart-count">0</span></a></nav>
  </div></header>

  <main class="section-wrap page-main cart-page">
    <div class="page-title-row"><div><p class="eyebrow eyebrow-dark">Your picks</p><h1>Shopping cart</h1></div><a class="text-link" href="products.html">Continue shopping <span aria-hidden="true">&#8594;</span></a></div>
    <div class="cart-layout">
      <section id="cart-items" class="cart-items" aria-label="Items in your cart"></section>
      <aside class="order-summary" aria-labelledby="summary-heading">
        <h2 id="summary-heading">Order summary</h2>
        <div class="summary-row"><span>Subtotal</span><span id="cart-subtotal">₹0</span></div>
        <div class="summary-row"><span>Delivery</span><span class="free-delivery">Free</span></div>
        <div class="summary-row summary-total"><span>Total</span><span id="cart-total">₹0</span></div>
        <a id="checkout-btn" class="button button-dark button-full" href="checkout.html">Proceed to Checkout</a>
        <p class="secure-note">Secure checkout · Free delivery</p>
      </aside>
    </div>
  </main>

  <footer id="site-footer" class="site-footer"><div class="section-wrap footer-inner"><a class="brand brand-footer" href="index.html"><span class="brand-mark">S</span>ShopEasy</a><p>Thoughtful picks for everyday life.</p><p class="copyright">&copy; 2026 ShopEasy</p></div></footer>
</body>
</html>
